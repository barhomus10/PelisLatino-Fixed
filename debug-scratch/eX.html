<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando...</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css"/>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}body *{transition:0.2s ease}::-webkit-scrollbar{position:absolute;width:6px}::-webkit-scrollbar-track{background:rgb(255 255 255 / .03)}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3a3f47,#1f2329);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#5865f2,#404eed)}.background{position:fixed;inset:0;z-index:1;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.08);/*filter:brightness(.35)*/}.background::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgb(0 0 0 / .3),rgb(0 0 0 / .85))}#the_frame{position:fixed;inset:0;width:100%;height:100%;z-index:5}#the_frame iframe{width:100%;height:100%;border:0}#startScreen{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.playButton{width:110px;height:110px;border-radius:50%;border:2px solid rgb(255 255 255 / .15);background:rgb(255 255 255 / .08);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s ease}.playButton:hover{transform:scale(1.06);background:rgb(255 255 255 / .14)}.playButton i{font-size:42px;margin-left:6px;color:#fff}.startText{font-size:15px;color:rgb(255 255 255 / .9);letter-spacing:.5px}#loader{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}.loader-ring{width:90px;height:90px;border-radius:50%;border:4px solid rgb(255 255 255 / .08);border-top:4px solid #00c2ff;animation:spin 1s linear infinite}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.loader-text{font-size:15px;color:rgb(255 255 255 / .85)}#errorBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgb(0 0 0 / .85);z-index:999999}#errorBox i{font-size:50px;color:#ff4b4b}#errorBox p{margin:0;color:#ddd}html:hover .servers{height:auto;opacity:1}.servers{opacity:0;position:absolute;left:15px;top:50%;z-index:9999;display:none}.active,.servers .serversList .server:hover{background:rgba(255, 255, 255, 0.2);color:#ffffff!important;text-shadow:0 0 3px #000}.serversToggle{opacity:.85;font-size:1.9rem;background:rgba(0, 0, 0, 0.5);border:1px solid rgba(255, 255, 255, 0.15);border-radius:8px;padding:10px;color:#fff}.serversList{display:none;background:rgba(0, 0, 0, 0.5);float:right;font-size:.9rem;margin-left:8px;backdrop-filter:blur(10px);box-shadow:0 5px 20px rgb(0, 0, 0)}.serverOpt{background:rgba(0, 0, 0, 0.5);text-transform:uppercase;text-align:center;padding:10px;color:#fff;font-weight:700;border-bottom:1px solid rgb(88 101 242 / .2)}.server{padding:8px 10px;cursor:pointer;text-align:center;text-transform:uppercase;color:#cfd3dc;font-weight:700}.serversToggle:hover{cursor:pointer}.server:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="background" id="background"></div>
<div id="startScreen">
    <div class="playButton">
        <i class="fas fa-play"></i>
    </div>
    <!--<div class="startText">
        Clic para Obtener contenido
    </div>-->
</div>

<div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">
        Obteniendo resultados...
    </div>
</div>

<div id="errorBox">
    <i class="fas fa-exclamation-triangle"></i>
    <p>No se pudo obtener el contenido</p>
</div>

<div id="the_frame"></div>
<div class="servers">
    <i class="fas fa-exchange-alt serversToggle"></i>
    <div class="serversList"></div>
</div>

<script>
let currentServer = null;
let currentContentKey = null;

$(function() {
    let embeds = {};
    const STORAGE_KEY = "selectedEmbedServer";
    function showLoader() {
        $("#loader").css(
            "display",
            "flex"
        );
    }
    function hideLoader() {
        $("#loader").fadeOut(
            300
        );
    }
    function loadPlayer(
        url,
        el,
        serverName = null,
        saveSelection = false
    ) {
        const contentKey = url;
        
        /*
        if (
            currentServer === serverName &&
            currentContentKey === contentKey
        ) {
            return;
        }
    
        currentServer = serverName;
        currentContentKey = contentKey;
        */

        $(".server").removeClass("active");
        el.addClass("active");
    
        if (
            saveSelection &&
            serverName
        ) {
    
            localStorage.setItem(
                STORAGE_KEY,
                serverName
            );
        }
    
        $("#the_frame").html(
            '<iframe ' +
            'src="' + url + '" ' +
            'allowfullscreen ' +
            'scrolling="no">' +
            '</iframe>'
        );
    }
    function getServerLabel(name) {
        const labels = {
            playpaste: "Opción 1",
            alt: "Latino",
            alt1: "Multi",
            alt2: "Stream",
            alt3: "Inglés (CC)"
        };
        return labels[name] || name;
    }
    function renderServers(data) {
        embeds = data.embeds || {};
        let html = '';
        const serverOrder = [
            "playpaste",
            "alt",
            "alt1",
            "alt2",
            "alt3"
        ];
        const orderedEmbeds = {};
        serverOrder.forEach(function(key) {
            if (embeds[key]) {
                orderedEmbeds[key] =
                    embeds[key];
            }
        });
        const storedServer =
            localStorage.getItem(
                STORAGE_KEY
            );
        $.each(
            orderedEmbeds,
            function(name, url) {
                html +=
                    '<div class="server" ' +
                    'data-name="' + name + '" ' +
                    'data-url="' + url + '">' +
                    getServerLabel(name) +
                    '</div>';
            }
        );
        
        $(".serversList").html('<div class="serverOpt"><i class="fas fa-headphones"></i> Opciones</div>' + html);
        $(".servers").show();
        
        $(".server").on(
            "click",
            function() {
    
                loadPlayer(
                    $(this).data("url"),
                    $(this),
                    $(this).data("name"),
                    true
                );
    
                $(".serversList")
                    .hide();
            }
        );
        
        let selectedServer = null;
        
        if (
            storedServer &&
            orderedEmbeds[storedServer]
        ) {
    
            selectedServer =
                $('.server[data-name="' +
                    storedServer +
                '"]');
        }
        
        if (
            !selectedServer ||
            !selectedServer.length
        ) {
    
            selectedServer =
                $(".server").first();
        }

        if (
            selectedServer &&
            selectedServer.length
        ) {
        
            loadPlayer(
                selectedServer.data("url"),
                selectedServer,
                selectedServer.data("name"),
                false
            );
        }        
    }
    
    $(".serversToggle").on(
        "click",
        function() {

            $(".serversList")
                .toggle();
        }
    );
    
    $(document).on(
        "click",
        function(e) {
            if (
                !$(e.target)
                    .closest(".servers")
                    .length
            ) {

                $(".serversList")
                    .hide();
            }
        }
    );
    
    let playerData = null;
    let playbackStarted = false;
    
    function startPlayback() {
    
        if (playbackStarted) {
            return;
        }
    
        playbackStarted = true;
    
        $("#startScreen").hide();
    
        showLoader();
    
        if (playerData) {
    
            renderServers(playerData);
    
            hideLoader();
        }
    }

    function fetchPlayer() {
        $.ajax({
            url: "\/player\/api\/details.php?id=AZce_YwwCT9NzD-NXi9-4MMJGLKANr5YizVIT5oX0lozDttklxiylX43G7-ESBX6c2Knk-l2n52kluNe9USxYQ",
            method: "GET",
            dataType: "json",
            success: function(data) {
                if (
                    !data ||
                    !data.embeds
                ) {
    
                    $("#loader").hide();
    
                    $("#errorBox").css(
                        "display",
                        "flex"
                    );
    
                    return;
                }
    
                playerData = data;
    
                if (data.title) {
    
                    document.title =
                        data.title;
                }
    
                if (data.backdrop) {
    
                    $("#background").css(
                        "background-image",
                        'url("' + data.backdrop + '")'
                    );
                }
    
                if (playbackStarted) {
                
                    renderServers(playerData);
                
                    hideLoader();
                }
                
                            },
    
            error: function() {
    
                $("#loader").hide();
    
                $("#errorBox").css(
                    "display",
                    "flex"
                );
            }
        });
    }

    fetchPlayer();
    
        
    $("#startScreen").on(
        "click",
        function() {
    
            startPlayback();
        }
    );
    
    
});

window.addEventListener(
    "message",
    function(e) {
        let iframe = document.querySelector("#the_frame iframe");
        
        if (!iframe) {
            return;
        }

        if (
            e.source === window.parent
        ) {

            iframe.contentWindow
                .postMessage(
                    e.data,
                    "*"
                );

        } else if (
            e.source ===
            iframe.contentWindow
        ) {

            window.parent
                .postMessage(
                    e.data,
                    "*"
                );
        }
    }
);
</script>
</body>
</html>
